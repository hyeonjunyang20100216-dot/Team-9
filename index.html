<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>베네듀 땅따먹기</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="메인으로 이동">
      <span class="brand-mark">B</span>
      <span>
        <strong>베네듀 땅따먹기</strong>
      </span>
    </a>
    <nav class="top-actions">
      <a class="ghost-link" href="admin.html">어드민</a>
      <button id="resetUserBtn" class="ghost-button" type="button">로그아웃</button>
    </nav>
  </header>

  <main>
    <section id="homePage" class="page hero-page">
      <div class="hero-card">
        <div class="hero-copy">
          <h1>베네듀 땅따먹기</h1>
          <p class="hero-desc">문제를 풀고 칸을 점령하는 2개 반 대항전.</p>
        </div>

        <form id="loginForm" class="login-card" autocomplete="off">
          <h2>입장</h2>
          <p id="matchNotice" class="notice muted">어드민에서 경기를 먼저 시작해야 합니다.</p>

          <label for="classSelect">반 선택</label>
          <select id="classSelect" required>
            <option value="">반을 선택하세요</option>
            <option value="1">1반</option>
            <option value="2">2반</option>
            <option value="3">3반</option>
            <option value="4">4반</option>
            <option value="5">5반</option>
            <option value="6">6반</option>
          </select>

          <label for="studentName">이름</label>
          <input id="studentName" type="text" maxlength="10" placeholder="예: 김디미" required />

          <button class="primary-button" type="submit">게임 입장</button>
        </form>
      </div>
    </section>

    <section id="gamePage" class="page game-page hidden" aria-label="게임 진행 화면">
      <section class="scoreboard" aria-label="경기 현황">
        <div class="match-title">
          <p id="matchPair">경기 정보 없음</p>
          <h2 id="playerBadge">입장 정보 없음</h2>
        </div>

        <div class="timer-card">
          <span>남은 시간</span>
          <strong id="gameTimer">20:00</strong>
        </div>

        <div class="ratio-box">
          <div class="ratio-head">
            <span id="leftRatioText">왼쪽 0칸</span>
            <strong>점령 비율</strong>
            <span id="rightRatioText">오른쪽 0칸</span>
          </div>
          <div class="ratio-track" aria-label="점령 비율 바">
            <div id="leftRatioBar" class="ratio-fill left"></div>
            <div id="neutralRatioBar" class="ratio-fill neutral"></div>
            <div id="rightRatioBar" class="ratio-fill right"></div>
          </div>
          <div id="neutralText" class="neutral-text">중립 400칸</div>
        </div>
      </section>

      <section class="game-layout">
        <section class="board-panel">
          <div class="board-toolbar">
            <div>
              <h3>격자판</h3>
            </div>
            <button id="refreshBtn" class="small-button" type="button">새로고침</button>
          </div>
          <div id="board" class="board" role="grid" aria-label="20 곱하기 20 땅따먹기 격자판"></div>
        </section>

        <aside class="side-panel" aria-label="점수와 로그">
          <div class="class-panel">
            <h3>점수</h3>
            <div id="playerStats" class="player-card"></div>
            <div id="classScores" class="score-list"></div>
          </div>
          <div class="log-panel">
            <div class="log-head">
              <h3>점령 로그</h3>
              <span></span>
            </div>
            <ul id="logList" class="log-list"></ul>
          </div>
        </aside>
      </section>
    </section>
  </main>

  <div id="questionModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="questionTitle">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <p id="questionMeta" class="question-meta">문제 정보</p>
          <h2 id="questionTitle">문제</h2>
        </div>
        <button id="closeModalBtn" class="icon-button" type="button" aria-label="닫기">×</button>
      </div>
      <p id="questionText" class="question-text"></p>
      <div id="choiceList" class="choice-list"></div>
      <div class="modal-actions">
        <button id="submitAnswerBtn" class="primary-button" type="button">정답 제출</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/game-data.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
